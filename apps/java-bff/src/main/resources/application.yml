server:
  port: ${JAVA_PORT:8600}
  shutdown: graceful

spring:
  application:
    name: wuye-agent-bff
  web:
    resources:
      cache:
        period: 0
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

wuye:
  agent:
    mode: ${WUYE_AGENT_MODE:mock}
    connect-timeout-ms: 3000
    read-timeout-ms: 20000
    registry:
      load-on-startup: ${AGENT_REGISTRY_LOAD_ON_STARTUP:true}
    property:
      base-url: ${AGENT_PROPERTY_BASE_URL:http://127.0.0.1:8402}
      internal-token: ${AGENT_PROPERTY_INTERNAL_TOKEN:}
      audience: ${AGENT_PROPERTY_AUDIENCE:property-maintenance}
      actor-id: ${AGENT_PROPERTY_ACTOR_ID:10001}
      roles: ${AGENT_PROPERTY_ROLES:ADMIN}
      tenant-id: ${AGENT_PROPERTY_TENANT_ID:0}
      delegation-path: /agent/v1/delegation/token
      delegation-scopes: ${AGENT_PROPERTY_DELEGATION_SCOPES:*}
      use-delegation: true
    contract:
      base-url: ${AGENT_CONTRACT_BASE_URL:http://127.0.0.1:8400}
      internal-token: ${AGENT_CONTRACT_INTERNAL_TOKEN:}
      audience: ${AGENT_CONTRACT_AUDIENCE:agent-hetong}
      actor-id: ${AGENT_CONTRACT_ACTOR_ID:10001}
      roles: ${AGENT_CONTRACT_ROLES:ADMIN}
      # 合同 Agent 要求 tenantId 为正整数；默认 1。
      tenant-id: ${AGENT_CONTRACT_TENANT_ID:1}
      delegation-path: /agent/v1/delegation/token
      # 合同不接受通配符 scope，必须是已声明能力。
      delegation-scopes: ${AGENT_CONTRACT_DELEGATION_SCOPES:contract.resolve,contract.review,contract.rule.list,contract.rule.create,knowledge.search}
      use-delegation: true
  ai:
    enabled: ${WUYE_AI_ENABLED:false}
    # 编排网关：仅在 enabled=true 时生效；失败自动回退现有同步流程
    orchestration-enabled: ${WUYE_ORCHESTRATION_ENABLED:true}
    base-url: ${AI_BASE_URL:http://127.0.0.1:8700}
    internal-token: ${INTERNAL_TOKEN_J2P:}
    timeout-ms: 9000
    confidence-threshold: 0.55
    rule-confidence-threshold: 0.85
    input-price-per-1k: ${LLM_INPUT_PRICE_PER_1K:0}
    output-price-per-1k: ${LLM_OUTPUT_PRICE_PER_1K:0}
  auth:
    jwt-secret: ${JWT_SECRET:}
    token-ttl-seconds: 28800
  notify:
    # 外部 Agent 写入站内通知的内部令牌；为空时内部接口拒绝写入。
    token: ${NOTIFY_INTERNAL_TOKEN:}
  identity:
    # 底座 → 子 Agent 的 HMAC 身份断言密钥；为空时不发送。
    assertion-secret: ${IDENTITY_ASSERTION_SECRET:}
  attachment:
    # 聊天附件本地存储；生产应替换为对象存储适配器
    root: ${CHAT_ATTACHMENT_ROOT:data/chat-attachments}
    max-bytes: ${CHAT_ATTACHMENT_MAX_BYTES:10485760}
  dev:
    admin-password: ${DEV_ADMIN_PASSWORD:admin123}
    worker-password: ${DEV_WORKER_PASSWORD:worker123}
    user-password: ${DEV_USER_PASSWORD:user123}
  rate-limit:
    per-minute: ${RATE_LIMIT_PER_MINUTE:300}
  event:
    # 进程内事件总线；Outbox 先落库再投递，后续可替换为 Kafka/Redis Stream
    enabled: ${EVENT_BUS_ENABLED:true}
    buffer-size: ${EVENT_BUFFER_SIZE:500}
    source: ${EVENT_SOURCE:wuye-agent-bff}
    outbox:
      enabled: ${EVENT_OUTBOX_ENABLED:true}
      relay-ms: ${EVENT_OUTBOX_RELAY_MS:5000}
      max-attempts: ${EVENT_OUTBOX_MAX_ATTEMPTS:5}
  flywheel:
    # 任务终态样本落 JSONL，供离线评测/偏好数据使用
    root: ${FLYWHEEL_ROOT:data/flywheel}
    recent-size: ${FLYWHEEL_RECENT_SIZE:200}

logging:
  level:
    root: INFO
    com.wuye.agent: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
